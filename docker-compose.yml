version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/voting_db?sslmode=disable
      - PORT=8080
      - LOG_LEVEL=info
      - JWT_SECRET=your-secret-key-change-in-production
    depends_on:
      - db
    volumes:
      - ./migrations:/app/migrations
    networks:
      - voting-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=voting_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voting-network

volumes:
  postgres_data:

networks:
  voting-network:
    driver: bridge 